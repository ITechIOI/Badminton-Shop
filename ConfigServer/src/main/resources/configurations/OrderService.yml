spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/orderservice?sslMode=REQUIRED}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "http://keycloak:8080/realms/micro-service"
          jwk-set-uri: http://keycloak:8080/realms/micro-service/protocol/openid-connect/certs

server:
  port: 8003

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,prometheus

