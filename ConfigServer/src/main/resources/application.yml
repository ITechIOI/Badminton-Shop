server:
  port: 8888

spring:
  profiles:
    active: native
  application:
    name: ConfigServer
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configurations

management:
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      #            endpoint: http://zipkin:9411/zipkin/
      endpoint: http://zipkin:9411/api/v2/spans