services:
  config-server:
    build: ./ConfigServer
    container_name: config-server
    depends_on:
      - kafka
      - elasticsearch
      - logstash
      - kibana
      - zipkin
      - keycloak
    ports:
      - "8888:8888"
    networks:
      - microservices-net

  discovery-server:
    build: ./DiscoveryServer
    container_name: discovery-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - microservices-net

  gateway:
    build: ./Gateway
    container_name: gateway-service
    ports:
      - "8222:8222"
    depends_on:
      - config-server
      - discovery-server
    networks:
      - microservices-net
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: GatewayService
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/micro-service/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/micro-service
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_HINTS.USER-SERVICE: "http://user-service:8001" # Gợi ý URL cho Gateway
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

  user-service:
    build: ./UserService
    container_name: user-service
    ports:
      - "8001:8001"
    depends_on:
      - config-server
      - discovery-server
    networks:
      - microservices-net
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: UserService
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/micro-service/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/micro-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true" # Sử dụng IP thay vì hostname
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: 10
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: 30

  product-service:
    build: ./ProductService
    container_name: product-service
    ports:
      - "8002:8002"
    depends_on:
      - config-server
      - discovery-server
    networks:
      - microservices-net
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: ProductService
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/micro-service/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/micro-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true" # Sử dụng IP thay vì hostname
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: 10
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: 30
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  order-service:
    build: ./OrderService
    container_name: order-service
    ports:
      - "8003:8003"
    depends_on:
      - config-server
      - discovery-server
    networks:
      - microservices-net
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: OrderService
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/micro-service/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/micro-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true" # Sử dụng IP thay vì hostname
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: 10
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: 30
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  payment-service:
    build: ./PaymentService
    container_name: payment-service
    ports:
      - "8004:8004"
    depends_on:
      - config-server
      - discovery-server
    networks:
      - microservices-net
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: PaymentService
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/micro-service/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/micro-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true" # Sử dụng IP thay vì hostname
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: 10
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: 30
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  notification-service:
    build: ./NotificationService
    container_name: notification-service
    ports:
      - "8005:8005"
    depends_on:
      - config-server
      - discovery-server
    networks:
      - microservices-net
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: NotificationService
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/micro-service/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/micro-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true" # Sử dụng IP thay vì hostname
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: 10
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: 30

  report-service:
    build: ./ReportService
    container_name: report-service
    ports:
      - "8007:8007"
    depends_on:
      - config-server
      - discovery-server
    networks:
      - microservices-net
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: ReportService
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/micro-service/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/micro-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true" # Sử dụng IP thay vì hostname
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: 10
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: 30

  recommend-service:
    build:
      context: ./RecommendService
    container_name: recommend-service
    ports:
      - "8008:8008"
    networks:
      - microservices-net
    depends_on:
      - config-server
      - discovery-server
      - keycloak
      - redis
      - elasticsearch
      - logstash
    environment:
      - PINECONE_API_KEY=pcsk_6ngBzM_5ueoEuEehZZXiQZGiFJDWaAavcMizu9qSesb4uroh9hdykvYPfXCxFR7HVuSp69
      - PINECONE_ENV=us-east-1
      - PINECONE_INDEX=badminton
      - NESTJS_MENU_ENDPOINT=http://localhost:8222/products/products/all-no-paginate
      - JINA_API_TOKEN=jina_c1a010084b044840a2f3f4627e1b1bf81zPiEMAuM6Pba1eZgzllpfurtUen

  behavior-service:
    build: ./UserBehaviorService
    container_name: behavior-service
    ports:
      - "8009:8009"
    depends_on:
      - config-server
      - discovery-server
    networks:
      - microservices-net
    environment:
      SPRING_PROFILES_ACTIVE: default
      SPRING_APPLICATION_NAME: UserBehaviorService
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/micro-service/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/micro-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true" # Sử dụng IP thay vì hostname
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: 10
      EUREKA_INSTANCE_LEASE_EXPIRATION_DURATION_IN_SECONDS: 30

  zookeeper:
    image: itechioi/badminton-gear:zookeeper
    container_name: zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: yes
      ZOO_PORT_NUMBER: 2181
    ports:
      - "2181:2181"
    networks:
      - microservices-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_CLUSTER_ID: Q1Sh9VZQ0u4dN1sFJKabwA

    networks:
      - microservices-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.monitoring.templates.enabled=true
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 10s
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - microservices-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.3
    container_name: kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    networks:
      - microservices-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.3
    container_name: logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5000:5000" # Nhận logs từ Microservices qua TCP
      - "9600:9600" # Cổng quản lý Logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - microservices-net

  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin
    volumes:
      - zipkin-data:/zipkin-data
    ports:
      - "9411:9411"
    networks:
      - microservices-net

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0.2
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      DB_VENDOR: h2
      # KC_HOSTNAME: keycloak
    volumes:
      - keycloak-h2-data:/opt/keycloak/data
    ports:
      - "9098:8080"
    networks:
      - microservices-net
    #    command:
    #      - "start-dev"
    command:
      - "start-dev"
      - --hostname-strict=false
      - --hostname-url=http://keycloak:8080

  redis:
    image: redis:7.2-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    networks:
      - microservices-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # Cấu hình chính
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Các rule alert
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
    command:
      - "--config.file=/etc/alertmanager/config.yml"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      # thay đổi nếu cần, ví dụ mật khẩu admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      # Lưu trữ dữ liệu Grafana (dashboard, user, setting…)
      - grafana-storage:/var/lib/grafana
      # Cấu hình provisioning: datasource + dashboards
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  keycloak-h2-data:
  zipkin-data:
  es_data:
  redis-data:
  grafana-storage:


networks:
  microservices-net:
    driver: bridge
