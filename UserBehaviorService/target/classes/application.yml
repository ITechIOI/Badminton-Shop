spring:
  application:
    name: UserBehaviorService
  config:
    import: optional:configserver:http://config-server:8888

  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 10
        initial-interval: 2000
        multiplier: 1.5
        max-interval: 10000

logging:
  level:
    root: INFO
  appender:
    logstash:
      destination: logstash:5000

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka

application:
  config:
    user-url: http://gateway:8222/users/users
    product-url: http://gateway:8222/products/products

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
